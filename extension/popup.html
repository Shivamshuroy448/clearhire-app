<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>ClearHire LinkedIn Sync</title>
    <style>
        body {
            width: 300px;
            margin: 0;
            padding: 16px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #0f172a;
            background: #f8fafc;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
        }
        .logo {
            width: 28px;
            height: 28px;
            background: #0284c7;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
        }
        .title {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
        }
        .subtitle {
            font-size: 11px;
            color: #64748b;
        }
        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }
        .label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            color: #64748b;
            margin-bottom: 4px;
            display: block;
        }
        input {
            width: 100%;
            box-sizing: border-box;
            padding: 7px 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 12px;
            color: #1e293b;
            margin-bottom: 8px;
        }
        button {
            width: 100%;
            padding: 9px 12px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
            margin-bottom: 8px;
        }
        button:hover {
            background: #0369a1;
        }
        button.secondary {
            background: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
        }
        button.secondary:hover {
            background: #e2e8f0;
        }
        .status {
            font-size: 12px;
            text-align: center;
            margin-top: 8px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">C</div>
        <div>
            <div class="title">ClearHire Sync</div>
            <div class="subtitle">LinkedIn Job Tracker Companion</div>
        </div>
    </div>

    <div class="card">
        <label class="label" for="user-id">ClearHire User ID</label>
        <input type="text" id="user-id" placeholder="User ID from ClearHire" />
        <label class="label" for="api-base">API Server</label>
        <input type="text" id="api-base" value="https://clearhire-app.vercel.app" />
        <button id="save-config-btn" class="secondary" style="margin-bottom: 0; padding: 6px;">Save Settings</button>
    </div>

    <button id="open-linkedin-btn">Open LinkedIn Job Tracker</button>
    <button id="open-app-btn" class="secondary">Open ClearHire App</button>

    <div class="status" id="status-text"></div>

    <script src="popup.js"></script>
</body>
</html>
